<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cultura MIO — plataforma de cultura ciudadana para el transporte masivo de Cali." />
    <meta name="theme-color" content="#0d3f73" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Cultura MIO · Cultura ciudadana en el transporte masivo</title>
    <script>
      // aplica el tema antes de pintar para que no parpadee
      (function () {
        try {
          var guardado = localStorage.getItem('cultura-mio-tema')
          var oscuro = guardado
            ? guardado === 'oscuro'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (oscuro) document.documentElement.classList.add('dark')
        } catch (e) {
          // si no hay almacenamiento se queda en claro
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
